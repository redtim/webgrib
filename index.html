<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gribwebview — HRRR in the browser</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script>
      // Set the UI mode before first paint so the wrong UI never flashes.
      document.documentElement.dataset.mode =
        localStorage.getItem('gribwebview-mode') === 'expert' ? 'expert' : 'easy';
    </script>
    <style>
      html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0d10; }

      :root { --panel-width: 292px; }

      /* ---- panel ---- */
      #panel {
        position: absolute; top: 12px; left: 12px; z-index: 10;
        background: rgba(11, 13, 16, 0.88); color: #e6edf3;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; padding: 10px 12px; border-radius: 6px;
        border: 1px solid #30363d; min-width: 240px; max-width: 280px;
        max-height: calc(100vh - 24px); overflow-y: auto;
      }
      #panel-expand {
        display: flex; align-items: center; justify-content: center;
        margin-top: 6px; padding: 3px 0; cursor: pointer;
        color: #8b949e; font-size: 10px; border-top: 1px solid #30363d;
        user-select: none; gap: 4px;
      }
      #panel-expand:hover { color: #e6edf3; }
      #panel-expand::after { content: '\25B2'; font-size: 8px; }
      #panel-expand.collapsed::after { content: '\25BC'; }
      #panel-layers { overflow: hidden; max-height: 2000px; transition: max-height 0.25s ease; }
      #panel-layers.collapsed { max-height: 0 !important; }
      #panel-header { display: flex; align-items: center; gap: 8px; margin: 0 0 6px 0; }
      #panel-header h1 { font-size: 13px; margin: 0; }
      #panel select { width: 100%; box-sizing: border-box; }
      #status { color: #7ee787; font-size: 11px; }
      #status.err { color: #ff7b72; }

      /* ---- layer panel ---- */
      .layer-panel { margin-top: 8px; border-top: 1px solid #30363d; padding-top: 6px; }
      .layer-group { margin-bottom: 2px; }
      .layer-group-header {
        cursor: pointer; padding: 4px 6px; color: #8b949e;
        font-size: 11px; font-weight: bold; text-transform: uppercase;
        letter-spacing: 0.5px; user-select: none;
      }
      .layer-group-header:hover { color: #e6edf3; }
      .layer-group-header::before { content: '\25BE '; font-size: 10px; }
      .layer-group.collapsed .layer-group-list { display: none; }
      .layer-group.collapsed .layer-group-header::before { content: '\25B8 '; }
      .layer-group-list { padding-left: 4px; }
      .layer-item {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 6px; cursor: pointer; border-radius: 3px;
      }
      .layer-item:hover { background: rgba(110, 118, 129, 0.15); }
      .layer-item.active { background: rgba(56, 139, 253, 0.2); color: #58a6ff; }
      .layer-kind {
        display: inline-flex; align-items: center; justify-content: center;
        width: 16px; height: 16px; border-radius: 3px;
        font-size: 9px; font-weight: bold; flex-shrink: 0;
      }
      .layer-kind-scalar { background: #1f3d2e; color: #7ee787; }
      .layer-kind-wind { background: #1f2d3d; color: #79c0ff; }
      .layer-label { font-size: 11px; }

      /* ---- timeline bar (bottom) ---- */
      #timeline-bar {
        position: absolute; bottom: 10vh; z-index: 10;
        /* Center in the space right of the panel */
        left: calc(var(--panel-width) + (100vw - var(--panel-width)) / 2);
        transform: translateX(-50%);
        transition: left 0.2s ease;
        background: rgba(22, 27, 34, 0.92);
        border: 1px solid #30363d; border-radius: 8px;
        padding: 8px 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; color: #e6edf3;
        max-width: calc(100vw - var(--panel-width) - 40px);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      }
      #timeline-bar.panel-hidden {
        left: 50%;
        max-width: 90vw;
      }
      .timeline { display: flex; flex-direction: column; align-items: center; gap: 4px; overflow: hidden; }
      .timeline-scroll {
        overflow-x: auto; overflow-y: hidden; width: 100%;
        scrollbar-width: thin; scrollbar-color: #30363d transparent;
      }
      .timeline-inner { display: inline-flex; flex-direction: column; min-width: 100%; }
      .timeline-day-row { display: flex; align-items: flex-end; gap: 0; padding: 0 0 2px 0; flex-shrink: 0; }
      .timeline-day-label {
        color: #8b949e; font-size: 10px; font-weight: bold; text-transform: uppercase;
        text-align: center; border-left: 1px solid #484f58; padding: 0 4px;
        flex-shrink: 0;
      }
      .timeline-day-label:first-child { border-left: none; }
      .timeline-ticks { flex-shrink: 0; }
      .timeline-tick {
        flex-shrink: 0; min-width: 20px; padding: 2px 3px;
        background: #161b22; border: 1px solid #30363d; border-radius: 3px;
        color: #8b949e; font-size: 10px; cursor: pointer;
        font-family: inherit; text-align: center;
      }
      .timeline-tick:hover { background: #21262d; color: #e6edf3; }
      .timeline-tick.active { background: #1f6feb; color: #fff; border-color: #388bfd; }
      .timeline-btn {
        background: #161b22; border: 1px solid #30363d; border-radius: 3px;
        color: #e6edf3; font-size: 11px; font-family: inherit;
        padding: 2px 8px; cursor: pointer;
      }
      .timeline-btn:hover { background: #21262d; }

      /* Model chips replace the model dropdown in easy mode */
      .timeline-models { display: none; }
      :root[data-mode="easy"] .timeline-models {
        display: flex; margin-left: 8px; border-radius: 999px; overflow: hidden;
        border: 1px solid #30363d;
      }
      .timeline-model {
        background: #161b22; color: #8b949e; border: none; cursor: pointer;
        font: 600 11px system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 4px 10px;
      }
      .timeline-model:hover { color: #e6edf3; }
      .timeline-model.active { background: #1f6feb; color: #fff; }
      .timeline-model:disabled { opacity: 0.5; cursor: default; }

      /* ---- level slider ---- */
      .level-slider { margin-top: 8px; border-top: 1px solid #30363d; padding-top: 6px; }
      .level-slider-title {
        color: #8b949e; font-size: 11px; font-weight: bold;
        text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
      }
      .level-slider-list { display: flex; flex-direction: column; gap: 1px; }
      .level-btn {
        padding: 3px 8px; background: #161b22; border: 1px solid #30363d;
        border-radius: 3px; color: #8b949e; font-size: 11px; cursor: pointer;
        font-family: inherit; text-align: left;
      }
      .level-btn:hover { background: #21262d; color: #e6edf3; }
      .level-btn.active { background: #1f6feb; color: #fff; border-color: #388bfd; }
      .layer-levels-badge {
        margin-left: auto; font-size: 9px; color: #8b949e;
        background: #21262d; padding: 1px 4px; border-radius: 3px;
      }

      /* ---- legend ---- */
      .legend { border-top: 1px solid #30363d; padding-top: 6px; }

      /* ---- popup ---- */
      .maplibregl-popup-content {
        background: rgba(11, 13, 16, 0.92); color: #e6edf3;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px; padding: 8px 10px;
        border: 1px solid #30363d; border-radius: 4px;
      }
      .maplibregl-popup-tip { display: none; }
      .inspect-title { color: #7ee787; font-weight: bold; margin-bottom: 4px; }
      .inspect-row { display: flex; justify-content: space-between; gap: 12px; }
      .inspect-row .k { color: #8b949e; }

      :root[data-mode="easy"] .maplibregl-popup-content {
        font: 13px system-ui, -apple-system, 'Segoe UI', sans-serif;
        border: none; border-radius: 10px; padding: 10px 28px 10px 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      }
      :root[data-mode="easy"] .inspect-row { gap: 20px; line-height: 1.6; }
      :root[data-mode="easy"] .inspect-row span:last-child { font-weight: 600; }
      :root[data-mode="easy"] .maplibregl-popup-close-button { color: #8b949e; font-size: 16px; }

      .forecast-btn {
        display: block; width: 100%; margin-top: 8px; padding: 4px 8px;
        background: #1f6feb; color: #fff; border: none; border-radius: 4px;
        font: inherit; cursor: pointer;
      }
      .forecast-btn:hover { background: #388bfd; }

      /* ---- point forecast strip ---- */
      #forecast-strip {
        position: absolute; z-index: 10; left: 50%; transform: translateX(-50%);
        bottom: calc(10vh + 104px);
        max-width: calc(100vw - var(--panel-width) - 40px); box-sizing: border-box;
        background: rgba(22, 27, 34, 0.94); color: #e6edf3;
        border: 1px solid #30363d; border-radius: 8px; padding: 6px 10px 8px;
        font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      }
      :root[data-mode="expert"] #forecast-strip {
        left: calc(var(--panel-width) + (100vw - var(--panel-width)) / 2);
      }
      :root[data-mode="easy"] #forecast-strip {
        bottom: 124px; border: none; border-radius: 12px; max-width: calc(100vw - 24px);
      }
      :root[data-mode="easy"].forecast-open #easy-rail { max-height: calc(100vh - 330px); }
      .forecast-header {
        display: flex; justify-content: space-between; align-items: center;
        font-weight: 600; margin-bottom: 4px;
      }
      .forecast-close {
        background: none; border: none; color: #8b949e; font-size: 18px;
        line-height: 1; cursor: pointer; padding: 0 2px;
      }
      .forecast-close:hover { color: #fff; }
      .forecast-body { overflow-x: auto; scrollbar-width: thin; scrollbar-color: #30363d transparent; }
      .forecast-body table { border-collapse: separate; border-spacing: 1px; }
      .forecast-body th { font-weight: 500; color: #8b949e; white-space: nowrap; padding: 2px 6px; }
      .forecast-day { text-align: left; border-left: 1px solid #484f58; font-size: 11px; }
      .forecast-hour { cursor: pointer; font-size: 11px; }
      .forecast-hour.active { color: #fff; background: #1f6feb; border-radius: 3px; }
      .forecast-label {
        position: sticky; left: 0; z-index: 1; text-align: right;
        background: #161b22; color: #e6edf3 !important;
      }
      .forecast-cell {
        min-width: 58px; padding: 3px 6px; text-align: center; white-space: nowrap;
        cursor: pointer; border-radius: 3px; font-weight: 600;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        font-variant-numeric: tabular-nums;
      }
      .forecast-cell.loading { color: #484f58; font-weight: 400; }
      .forecast-cell.active { outline: 2px solid #58a6ff; outline-offset: -2px; }
      .forecast-arrow { display: inline-block; }
      .forecast-message { color: #8b949e; padding: 6px 2px; }

      /* ---- tide station popups ---- */
      .tide-sparkline { margin-top: 4px; border-radius: 2px; background: rgba(22, 27, 34, 0.6); }
      .tide-loading { color: #8b949e; font-style: italic; padding: 4px 0; }

      /* ---- station DOM markers ---- */
      .station-marker {
        display: flex; align-items: center; gap: 4px;
        background: rgba(11, 13, 16, 0.88);
        border: 1px solid #30363d; border-radius: 4px;
        padding: 2px 5px 2px 3px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px; white-space: nowrap;
        cursor: pointer;
      }
      .station-badge {
        display: inline-flex; align-items: center; justify-content: center;
        width: 14px; height: 14px; border-radius: 3px;
        background: rgba(255,255,255,0.08);
        font-size: 9px; font-weight: bold; flex-shrink: 0;
      }
      .station-val { color: #e6edf3; }
      .station-anom { font-size: 9px; }
      .station-marker-current { background: rgba(11, 13, 16, 0.65); border-color: rgba(48, 54, 61, 0.5); }
      .station-arrow {
        display: inline-block; font-size: 13px; line-height: 1;
        font-weight: bold; flex-shrink: 0;
      }

      /* ---- map controls (locate-me) ---- */
      .maplibregl-ctrl-bottom-left { z-index: 10; }
      /* Lifted clear of the timeline bar, which spans most of the width on
         narrow screens (expert: bottom 10vh; easy: bottom 24px). */
      .maplibregl-ctrl-bottom-left .maplibregl-ctrl-group {
        margin: 0 0 calc(10vh + 108px) calc(var(--panel-width) + 12px);
        transition: margin-left 0.2s ease;
        background: rgba(22, 27, 34, 0.85);
        border: 1px solid #30363d; border-radius: 999px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }
      .maplibregl-ctrl-group button.maplibregl-ctrl-geolocate {
        width: 40px; height: 40px; border-radius: 999px;
      }
      .maplibregl-ctrl-group button.maplibregl-ctrl-geolocate:not(:disabled):hover {
        background-color: rgba(48, 54, 61, 0.95);
      }
      .maplibregl-ctrl-group button.maplibregl-ctrl-geolocate:disabled { opacity: 0.4; }
      :root[data-mode="easy"] .maplibregl-ctrl-bottom-left .maplibregl-ctrl-group { margin-bottom: 132px; }
      .maplibregl-ctrl button.maplibregl-ctrl-geolocate .maplibregl-ctrl-icon {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e6edf3' stroke-width='1.8' stroke-linecap='round'><circle cx='12' cy='12' r='6'/><circle cx='12' cy='12' r='1.6' fill='%23e6edf3' stroke='none'/><path d='M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22'/></svg>");
      }
      .maplibregl-ctrl button.maplibregl-ctrl-geolocate-active .maplibregl-ctrl-icon,
      .maplibregl-ctrl button.maplibregl-ctrl-geolocate-background .maplibregl-ctrl-icon {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='1.8' stroke-linecap='round'><circle cx='12' cy='12' r='6'/><circle cx='12' cy='12' r='2.2' fill='%2358a6ff' stroke='none'/><path d='M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22'/></svg>");
      }
      .maplibregl-ctrl button.maplibregl-ctrl-geolocate-active-error .maplibregl-ctrl-icon,
      .maplibregl-ctrl button.maplibregl-ctrl-geolocate-background-error .maplibregl-ctrl-icon {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff7b72' stroke-width='1.8' stroke-linecap='round'><circle cx='12' cy='12' r='6'/><path d='M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22M9.5 9.5l5 5M14.5 9.5l-5 5'/></svg>");
      }
      .maplibregl-ctrl button.maplibregl-ctrl-geolocate-waiting .maplibregl-ctrl-icon {
        animation: easy-spin 1s linear infinite;
      }
      .maplibregl-user-location-dot, .maplibregl-user-location-dot::before { background-color: #58a6ff; }

      /* ---- easy mode ---- */
      #easy-card, #easy-rail { display: none; }
      #mode-toggle {
        position: absolute; top: 12px; right: 12px; z-index: 11;
        background: rgba(22, 27, 34, 0.85); color: #c9d1d9;
        border: 1px solid #30363d; border-radius: 999px;
        font: 500 12px system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: 6px 12px; cursor: pointer;
      }
      #mode-toggle:hover { color: #fff; background: rgba(33, 38, 45, 0.95); }

      :root[data-mode="easy"] { --panel-width: 0px; }
      :root[data-mode="easy"] #panel { display: none; }
      :root[data-mode="easy"] #easy-card,
      :root[data-mode="easy"] #easy-rail {
        display: block; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      #easy-card {
        position: absolute; top: 12px; left: 12px; z-index: 10;
        width: 240px; max-width: calc(100vw - 170px); box-sizing: border-box;
        background: rgba(22, 27, 34, 0.85); color: #e6edf3;
        border-radius: 12px; padding: 10px 14px 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }
      #easy-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
      #easy-card.busy #easy-title::after {
        content: ''; display: inline-block; vertical-align: middle;
        width: 12px; height: 12px; margin-left: 8px;
        border: 2px solid #484f58; border-top-color: #e6edf3; border-radius: 50%;
        animation: easy-spin 0.8s linear infinite;
      }
      @keyframes easy-spin { to { transform: rotate(360deg); } }
      #easy-legend .legend { margin-top: 0 !important; border-top: none; padding-top: 0; }
      #easy-opacity-row {
        display: flex; align-items: center; gap: 8px; margin-top: 10px;
        font-size: 12px; color: #8b949e;
      }
      #easy-opacity { flex: 1; min-width: 0; accent-color: #58a6ff; }
      #easy-status { font-size: 12px; color: #ff7b72; }
      #easy-status:not(:empty) { margin-top: 8px; }

      #easy-rail {
        position: absolute; top: 52px; right: 12px; z-index: 10;
        max-height: calc(100vh - 190px); overflow-y: auto; scrollbar-width: none;
      }
      .easy-rail-header {
        color: #c9d1d9; font-size: 10px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.6px; text-align: right; padding: 8px 6px 3px;
        text-shadow: 0 1px 3px #000;
      }
      .easy-rail-item {
        display: flex; align-items: center; justify-content: flex-end; gap: 8px;
        margin: 3px 0 3px auto; padding: 3px 3px 3px 12px;
        background: rgba(22, 27, 34, 0.8); color: #e6edf3;
        border: 1px solid transparent; border-radius: 999px;
        font: 500 13px system-ui, -apple-system, 'Segoe UI', sans-serif;
        cursor: pointer;
      }
      .easy-rail-item:hover { background: rgba(48, 54, 61, 0.95); }
      .easy-rail-item.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }
      .easy-rail-swatch {
        display: inline-flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
        border: 2px solid rgba(255, 255, 255, 0.85); font-size: 13px; font-weight: 700;
        color: var(--glyph-color, #fff);
      }

      /* Easy-mode timeline: no model run controls, larger touch targets */
      :root[data-mode="easy"] .timeline-run { display: none; }
      :root[data-mode="easy"] #timeline-bar {
        bottom: 24px; border: none; border-radius: 12px;
        max-width: calc(100vw - 24px); box-sizing: border-box;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      :root[data-mode="easy"] .timeline-valid { color: #e6edf3 !important; font-size: 14px !important; font-weight: 600; }
      :root[data-mode="easy"] .timeline-btn { border-radius: 999px; padding: 4px 12px; font-size: 12px; }
      :root[data-mode="easy"] .timeline-tick { min-width: 30px; padding: 5px 4px; font-size: 11px; }

      @media (max-width: 600px) {
        .easy-rail-label { display: none; }
        .easy-rail-item { padding: 3px; }
        .easy-rail-header { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="panel-header">
        <h1>HRRR</h1>
        <div id="status"></div>
      </div>
    </div>
    <div id="easy-card">
      <div id="easy-title"></div>
      <div id="easy-legend"></div>
      <label id="easy-opacity-row">Opacity
        <input type="range" id="easy-opacity" min="0.2" max="1" step="0.05" />
      </label>
      <div id="easy-status"></div>
    </div>
    <div id="easy-rail"></div>
    <button id="mode-toggle"></button>
    <div id="timeline-bar"></div>
    <div id="map"></div>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
